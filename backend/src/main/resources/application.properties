spring.application.name=msme-business-hub

server.port=${PORT:8080}

# CORS Configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://hv-2026-0075-powerhouse.vercel.app,https://hv-2026-0075-powerhouse-5ftr.vercel.app}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/msme_smartbiz_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.open-in-view=false

spring.jackson.serialization.fail-on-empty-beans=false


# AI CONFIGURATION

gemini.api-key=${GEMINI_API_KEY:}

gemini.model=${GEMINI_MODEL:gemini-3.6-flash}